<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Monday Handover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --ink:#15201d; --muted:#5f6d69; --line:#e2e8e6;
  --jade:#0f8f74; --jade-soft:#e3f4ef; --red:#d64545; --red-soft:#fdecec;
  --amber:#c9820a; --amber-soft:#fdf3e1; --blue:#2f6fd6; --blue-soft:#e8f0fd;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}

/* HEADER */
header{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.clinic{font-size:13px;color:var(--muted);font-weight:500}
.headline{font-size:22px;font-weight:800;margin:4px 0 0;letter-spacing:-.01em}
.headline em{font-style:normal;color:var(--red)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn-jade{background:var(--jade);color:#fff;padding:11px 16px;font-weight:700;display:flex;gap:8px;align-items:center}
.btn-jade:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--jade-soft);color:var(--jade);padding:11px 14px;font-weight:600}
.btn-stop{background:#eee;color:#333;padding:11px 14px;font-weight:600;display:none}
.timer{grid-column:1/-1;display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--jade);transition:width 1s linear}
.progress{font-weight:600;color:var(--ink)}

/* JADE PANEL */
.jade{margin-top:14px;background:linear-gradient(135deg,#0f8f74,#0b6d59);color:#fff;border-radius:16px;padding:16px 20px;display:none;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.jade.show{display:flex}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--jade);display:grid;place-items:center;font-weight:800;flex:none;position:relative}
.avatar.talking::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #9ff0dc;animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
.jade p{margin:2px 0 0;font-size:16px}
.jade small{opacity:.8}
.ask{margin-top:10px;display:flex;gap:8px}
.ask input{flex:1;border:0;border-radius:10px;padding:10px 12px;font:inherit}
.ask button{background:#fff;color:var(--jade);padding:0 12px;font-weight:700}
.mic.listening{background:var(--red);color:#fff}

/* GRID */
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.panel h2 .n{background:var(--bg);color:var(--ink);border-radius:20px;padding:2px 9px;font-size:12px}
.full{grid-column:1/-1}

.card{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:.25s}
.card.red{border-left-color:var(--red);background:var(--red-soft)}
.card.amber{border-left-color:var(--amber)}
.card.blue{border-left-color:var(--blue)}
.card .t{font-weight:700;display:flex;justify-content:space-between;gap:8px}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .why{margin-top:6px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts button{padding:7px 11px;font-size:13px;font-weight:600;background:var(--ink);color:#fff}
.acts button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card.done{opacity:.45;background:#fafafa;border-left-color:var(--jade)}
.card.done .acts{display:none}
.status{font-size:12.5px;font-weight:700;color:var(--jade);display:none;margin-top:8px}
.card.done .status{display:block}
.speaking{outline:3px solid #7fdcc4;outline-offset:2px;transform:scale(1.01)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;align-self:flex-start}
.tag.r{background:var(--red);color:#fff}.tag.a{background:var(--amber-soft);color:var(--amber)}.tag.b{background:var(--blue-soft);color:var(--blue)}

/* SLOTS */
.slot{display:grid;grid-template-columns:1fr 20px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;transition:.25s}
.slot .s{font-weight:700}.slot .s small,.slot .p small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.slot .p{font-weight:700}
.slot .arrow{color:var(--jade);font-weight:800;text-align:center}
.slot .go{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.slot .go button{padding:6px 11px;font-size:13px;font-weight:600;background:var(--jade);color:#fff}
.slot.done{background:var(--jade-soft);border-color:#bfe6da}
.slot.done .go button{display:none}
.offerall{width:100%;padding:11px;background:var(--jade);color:#fff;font-weight:700;margin-top:4px}

ul.list{margin:0;padding:0;list-style:none}
ul.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
ul.list li:last-child{border:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.handled{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.big{font-size:28px;font-weight:800;color:var(--jade)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--bg);border-radius:20px;padding:4px 10px;font-size:12.5px}
details summary{cursor:pointer;color:var(--jade);font-weight:600;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.insight{margin-top:12px;background:var(--amber-soft);border-radius:12px;padding:12px 14px}
.insight b{color:var(--amber)}

@media(max-width:820px){.grid{grid-template-columns:1fr}header{grid-template-columns:1fr}.controls{justify-content:flex-start}.headline{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="clinic" id="clinic"></div>
      <div class="headline" id="headline"></div>
    </div>
    <div class="controls">
      <button class="btn-jade" id="askBtn">✦ Ask Jade</button>
      <button class="btn-ghost" id="briefBtn">▶ Full voice briefing</button>
      <button class="btn-stop" id="stopBtn">■ Stop</button>
    </div>
    <div class="timer">
      <span>⏱ <b id="secs">90</b>s</span>
      <div class="bar"><i id="barFill"></i></div>
      <span class="progress" id="progress"></span>
    </div>
  </header>

  <section class="jade" id="jadePanel">
    <div class="avatar" id="avatar">J</div>
    <div style="flex:1">
      <small id="jadeLabel">Jade · summary</small>
      <p id="jadeText"></p>
      <div class="ask">
        <input id="q" placeholder="Ask Jade… e.g. “Who needs a callback?”, “What’s urgent?”">
        <button class="mic" id="micBtn" title="Speak">🎤</button>
        <button id="qBtn">Ask</button>
      </div>
    </div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2>🔴 Do now — before 8:30 <span class="n" id="nNow"></span></h2>
      <div id="doNow"></div>
    </section>

    <section class="panel">
      <h2>♻️ Fill freed slots <span class="n" id="nSlots"></span></h2>
      <div id="slots"></div>
      <button class="offerall" id="offerAll">Send all offers by SMS</button>
    </section>

    <section class="panel">
      <h2>👉 Delegate to reception <span class="n" id="nDel"></span></h2>
      <div id="delegate"></div>
    </section>

    <section class="panel">
      <h2>📋 Heads-up this week</h2>
      <ul class="list" id="headsup"></ul>
    </section>

    <section class="panel full">
      <div class="handled">
        <div><div class="big" id="handledN"></div><div style="color:var(--muted)">calls fully handled by Jade — no action needed</div></div>
        <div class="pills" id="pills"></div>
      </div>
      <details><summary>See all calls</summary><table id="allCalls"></table></details>
      <div class="insight" id="insight"></div>
    </section>
  </div>
</div>

  doNow.push({
    key:num, cls:"red", tag:[`${cs.length} CALLS`,"r"], name:cs[0].caller_name, calls:cs,
    meta:`Billing dispute · first call ${callTime(cs[0])} · last ${callTime(cs.at(-1))}`,
    why:"Says he was charged for a service he didn't receive. No callback since Friday and getting more frustrated — a bad-review risk.",
    primary:"Call before 9", speak:`${cs[0].caller_name} has called ${cs.length} times about a billing dispute and hasn't had a callback since Friday. He's getting frustrated.`
  });
});

// 2. SLOT MATCHING: freed slots ↔ people who couldn't get in
const freed = calls.filter(c => c.outcome==="cancelled" && c.appointment)
  .map(c => ({...c.appointment, from:c.caller_name, at:new Date(`${c.appointment.date}T${c.appointment.time}:00+11:00`)}))
  .filter(s => s.at >= NOW).sort((a,b)=>a.at-b.at);
const seekers = [];
calls.filter(c=>c.flagged==="urgent").forEach(c=>seekers.push({name:c.caller_name,num:c.caller_number,rank:0,reason:"urgent pain — see today"}));
const noAvail = [...new Set(calls.filter(c=>c.outcome==="no_availability").map(c=>c.caller_number))].filter(n=>!laterBooked(n));
noAvail.forEach(n => {
  const cs = byNumber[n]; const last = cs.at(-1);
  const lost = cs.some(c=>c.flagged==="lost_opportunity"), wait = cs.some(c=>c.flagged==="waitlist_requested");
  seekers.push({name:last.caller_name,num:n,rank:lost?1:2,
    reason: lost ? "wanted this week, said he'd go elsewhere" : wait ? `called ${cs.length}×, asked for waitlist` : "couldn't find a slot"});
});
seekers.sort((a,b)=>a.rank-b.rank);
const matches = freed.map((s,i)=>({slot:s, who:seekers[i]})).filter(m=>m.who);

// 3. DELEGATE
const delegate = [];
calls.filter(c=>c.flagged==="rebook_requested").forEach(c=>delegate.push({key:c.id,cls:"amber",name:c.caller_name,tag:["REBOOK","a"],
  why:"Cancelled for a family emergency — asked to be called to rebook next week.",meta:c.caller_number}));
calls.filter(c=>c.flagged==="bad_data").forEach(c=>delegate.push({key:c.id,cls:"amber",name:c.caller_name,tag:["NEW PATIENT","a"],
  why:`Number given was one digit short (041277520) — but caller ID captured <b>${c.caller_number}</b>. Call that.`,meta:"Wants a first appointment"}));
calls.filter(c=>c.flagged==="service_not_offered").forEach(c=>delegate.push({key:c.id,cls:"blue",name:c.caller_name,tag:["REFERRAL","b"],
  why:"Asked about orthodontics / clear aligners. Send an orthodontist referral.",meta:c.caller_number}));
const hang = calls.filter(c=>c.outcome==="hung_up");
if(hang.length) delegate.push({key:"hang",cls:"blue",name:`${hang.length} hang-ups`,tag:["SMS","b"],
  why:`Hung up at Jade's greeting. Send a “Sorry we missed you — book online” text.`,meta:hang.map(h=>h.caller_number).join(" · ")});

// 4. HEADS-UP
const heads = [];
calls.filter(c=>c.flagged==="priority").forEach(c=>heads.push(`<b>${dayShort(c.appointment.date)} ${hm(c.appointment.time)}</b> — ${c.caller_name}, ${c.appointment.type.toLowerCase()} (chipped tooth) with ${doc(c.appointment.practitioner)}`));
calls.filter(c=>c.flagged==="note_for_practitioner").forEach(c=>heads.push(`<b>${c.caller_name}</b> is an anxious new patient — note for ${doc(c.appointment.practitioner)} (${dayShort(c.appointment.date)})`));
booked.filter(c=>/whitening/i.test(c.summary)).forEach(c=>heads.push(`<b>${c.caller_name}</b> wants to discuss whitening — referred by an existing patient`));
booked.filter(c=>/four years/i.test(c.summary)).forEach(c=>heads.push(`<b>${c.caller_name}</b> hasn't seen a dentist in 4 years — allow extra time`));
Object.values(byNumber).filter(cs=>cs.length>=3 && cs.at(-1).outcome==="booked").forEach(cs=>heads.push(`<b>${cs[0].caller_name}</b> needed ${cs.length} calls to get booked — a friendly welcome goes a long way`));

// counts
const actionIds = new Set([...doNow.flatMap(d=>d.calls.map(c=>c.id)),
  ...calls.filter(c=>["urgent","complaint","lost_opportunity","waitlist_requested","rebook_requested","bad_data","service_not_offered"].includes(c.flagged)||c.outcome==="hung_up").map(c=>c.id),
  ...calls.filter(c=>noAvail.includes(c.caller_number)).map(c=>c.id)]);
const handledCount = calls.length - actionIds.size;
const totalActions = doNow.length + matches.length + delegate.length;
const done = new Set();

/* ================= RENDER ================= */
$("clinic").textContent = `${DATA.clinic.name} · ${DATA.clinic.suburb} · Monday 17 Nov, 8:00am · Weekend 14–17 Nov`;
$("headline").innerHTML = `${calls.length} calls. ${booked.length} booked. ${handledCount} handled. <em>${doNow.length} need you now</em> — ${matches.length} slots to fill.`;
$("nNow").textContent = doNow.length; $("nSlots").textContent = matches.length; $("nDel").textContent = delegate.length;

function cardHTML(d, primary, secondary){
  return `<div class="card ${d.cls}" id="k-${d.key}">
    <div class="t"><span>${d.name}</span><span class="tag ${d.tag[1]}">${d.tag[0]}</span></div>
    <div class="meta">${d.meta}</div><div class="why">${d.why}</div>
    <div class="acts"><button onclick="act('${d.key}','✓ Done')">${primary}</button>${secondary?`<button class="sec" onclick="act('${d.key}','→ Assigned to reception')">${secondary}</button>`:""}</div>
    <div class="status"></div></div>`;
}
$("doNow").innerHTML = doNow.map(d=>cardHTML(d,d.primary,"Delegate")).join("");
$("delegate").innerHTML = delegate.map(d=>cardHTML(d,"Assign to reception",null)).join("");
$("slots").innerHTML = matches.map((m,i)=>`<div class="slot" id="k-slot${i}">
   <div class="s">${dayShort(m.slot.date)} · ${hm(m.slot.time)}<small>${doc(m.slot.practitioner)} · freed by ${m.slot.from}</small></div>
   <div class="arrow">→</div>
   <div class="p">${m.who.name}<small>${m.who.reason}</small></div>
   <div class="go"><span>${isToday(m.slot.date)?"⚡ Today":""}</span><button onclick="offer(${i})">Send offer</button></div></div>`).join("");
$("headsup").innerHTML = heads.map(h=>`<li><span class="dot"></span><span>${h}</span></li>`).join("");
$("handledN").textContent = handledCount;
const pillData = [["booked",booked.length],["questions answered",count("question_answered")],["wrong number",count("wrong_number")]];
$("pills").innerHTML = pillData.map(([l,n])=>`<span class="pill">${n} ${l}</span>`).join("")+`<span class="pill">${newPatients.length} new patients</span>`;
$("allCalls").innerHTML = calls.map(c=>`<tr><td>${callTime(c)}</td><td><b>${c.caller_name||"Unknown"}</b></td><td>${c.outcome.replace(/_/g," ")}</td><td>${c.summary}</td></tr>`).join("");
const naCalls = calls.filter(c=>c.outcome==="no_availability");
const naPeople = new Set(naCalls.map(c=>c.caller_number)).size;
$("insight").innerHTML = `<b>💡 Pattern:</b> ${naCalls.length} calls from ${naPeople} people couldn't get a suitable slot — mostly for Monday/Tuesday. Early-week demand is beating capacity. Consider an extra early-week session or letting Jade run an automatic waitlist that fills cancellations instantly.`;

function updateProgress(){ $("progress").textContent = `${done.size} of ${totalActions} cleared`; }
updateProgress();

function act(key,label){
  const el=$("k-"+key); if(!el) return;
  el.classList.add("done"); el.querySelector(".status").textContent=label; done.add(key); updateProgress();
}
function offer(i){
  const el=$("k-slot"+i); if(el.classList.contains("done")) return;
  el.classList.add("done"); el.querySelector(".go span").textContent="✓ SMS offer sent"; done.add("slot"+i); updateProgress();
}
$("offerAll").onclick = () => { matches.forEach((_,i)=>offer(i)); say([{text:`Done. I've sent slot offers to ${listNames(matches.map(m=>m.who.name))}. I'll confirm as they reply.`}]); };
const listNames = a => a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a.at(-1);

/* ================= SUMMARY (60–90 words) ================= */
function buildSummary(){
  const u = doNow.find(d=>d.tag[0]==="URGENT"), cmp = doNow.find(d=>d.tag[0]!=="URGENT");
  const um = matches.find(m=>m.who.rank===0), rest = matches.filter(m=>m.who.rank!==0);
  let s = `Good morning. Over the weekend I answered all ${calls.length} calls and booked ${booked.length} appointments, including ${newPatients.length} new patients. Two things need you before eight thirty. `;
  if(u) s += `${u.name} called overnight in significant pain${um?` — ${um.slot.from}'s cancelled ${hm(um.slot.time)} with ${doc(um.slot.practitioner)} today is free, so offer it to him`:""}. `;
  if(cmp) s += `${cmp.name} has called ${cmp.calls.length===2?"twice":cmp.calls.length+" times"} about a billing dispute with no callback yet. `;
  if(rest.length) s += `Two more cancellations can go to ${listNames(rest.map(m=>m.who.name))}, who couldn't get in. `;
  s += `Reception can handle ${delegate.length} follow-ups. Everything else is done.`;
  return s;
}
const SUMMARY = buildSummary();

/* ================= FULL BRIEFING (per-card, highlights as it speaks) ================= */
function buildBriefing(){
  const q=[{text:`Good morning. This is Jade with your weekend handover for ${DATA.clinic.name}. ${calls.length} calls came in. I booked ${booked.length}, including ${newPatients.length} new patients.`}];
  q.push({text:`First, ${doNow.length} things need you before eight thirty.`});
  doNow.forEach(d=>q.push({text:d.speak, el:"k-"+d.key}));
  q.push({text:`Next, ${matches.length} cancellations freed up slots, and I've matched each one to someone who couldn't get in.`});
  matches.forEach((m,i)=>q.push({text:`${day(m.slot.date)} at ${hm(m.slot.time)} with ${doc(m.slot.practitioner)} could go to ${m.who.name}, who ${m.who.reason.replace("—","and")}.`, el:"k-slot"+i}));
  q.push({text:`Reception can handle these ${delegate.length} follow-ups.`});
  delegate.forEach(d=>q.push({text:`${d.name}: ${d.why.replace(/<[^>]+>/g,"").replace(/\+61/,"plus 6 1 ")}`, el:"k-"+d.key}));
  q.push({text:`Heads up for this week. ${heads.map(h=>h.replace(/<[^>]+>/g,"")).join(". ")}.`});
  q.push({text:`The other ${handledCount} calls are fully handled. One pattern: ${naCalls.length} calls couldn't get an early week slot, so demand is beating capacity. That's everything. Have a great day.`});
  return q;
}

/* ================= VOICE ENGINE ================= */
let voice=null;
function pickVoice(){
  const v=speechSynthesis.getVoices();
  voice = v.find(x=>/en-AU/i.test(x.lang)&&/female|karen|catherine|natasha/i.test(x.name))
       || v.find(x=>/en-AU/i.test(x.lang))
       || v.find(x=>/Google UK English Female|Samantha|Serena/i.test(x.name))
       || v.find(x=>/^en/i.test(x.lang)) || null;
}
pickVoice(); speechSynthesis.onvoiceschanged = pickVoice;

function clearHighlight(){ document.querySelectorAll(".speaking").forEach(e=>e.classList.remove("speaking")); }
function say(queue, label="Jade"){
  speechSynthesis.cancel(); clearHighlight();
  $("jadePanel").classList.add("show"); $("jadeLabel").textContent = label;
  $("stopBtn").style.display="block";
  queue.forEach((item,idx)=>{
    const u=new SpeechSynthesisUtterance(item.text);
    if(voice) u.voice=voice; u.rate=1.02; u.pitch=1.05;
    u.onstart=()=>{ $("avatar").classList.add("talking"); if(label!=="Jade · summary") $("jadeText").textContent=item.text;
      clearHighlight(); if(item.el){const e=$(item.el); if(e){e.classList.add("speaking"); e.scrollIntoView({behavior:"smooth",block:"center"});}}};
    u.onend=()=>{ if(idx===queue.length-1){ $("avatar").classList.remove("talking"); clearHighlight(); $("stopBtn").style.display="none"; } };
    speechSynthesis.speak(u);
  });
}
$("stopBtn").onclick=()=>{ speechSynthesis.cancel(); clearHighlight(); $("avatar").classList.remove("talking"); $("stopBtn").style.display="none"; };

/* ================= 90-SECOND TIMER ================= */
let timer=null;
function startTimer(){
  if(timer) return; let s=90;
  timer=setInterval(()=>{ s--; $("secs").textContent=Math.max(s,0); $("barFill").style.width=((90-s)/90*100)+"%";
    if(s<=0){clearInterval(timer);} },1000);
}

$("askBtn").onclick=()=>{ startTimer(); $("jadeText").textContent=SUMMARY+`  (${SUMMARY.split(/\s+/).length} words)`; say([{text:SUMMARY}],"Jade · summary"); };
$("briefBtn").onclick=()=>{ startTimer(); say(buildBriefing(),"Jade · full briefing"); };

/* ================= ASK JADE ANYTHING ================= */
function answer(q){
  q=q.toLowerCase();
  const names = a => listNames(a);
  if(/urgent|emergenc|pain|first/.test(q)) return `The urgent one is ${doNow[0].name}. He called at 2:14am in significant pain. ${matches[0]?`${matches[0].slot.from}'s ${hm(matches[0].slot.time)} slot today is free for him.`:""}`;
  if(/complain|billing|invoice|angry|michael|upset/.test(q)){const c=doNow.find(d=>d.tag[0]!=="URGENT"); return `${c.name} has called ${c.calls.length} times disputing an invoice. He wants the practice manager to call and hasn't heard back since Friday.`;}
  if(/cancel/.test(q)) return `${freed.length} cancellations: ${freed.map(s=>`${s.from} on ${day(s.date)} at ${hm(s.time)}`).join("; ")}. I've matched each freed slot to someone who couldn't get in.`;
  if(/slot|free|gap|fill|waitlist|wait list/.test(q)) return matches.map(m=>`${day(m.slot.date)} ${hm(m.slot.time)} to ${m.who.name}`).join("; ")+". Tap send all offers and I'll text them.";
  if(/new patient/.test(q)) return `${newPatients.length} new patients booked: ${names(newPatients.map(c=>c.caller_name))}.`;
  if(/today|this morning/.test(q)) return `Today, ${freed.filter(s=>isToday(s.date)).map(s=>`${s.from}'s ${hm(s.time)} with ${doc(s.practitioner)} was cancelled`).join(", ")}. Offer it to ${doNow[0].name}.`;
  if(/callback|call back|ring|phone/.test(q)) return `You call ${names(doNow.map(d=>d.name))}. Reception can call ${names(delegate.filter(d=>d.key!=="hang").map(d=>d.name))}, and text the ${hang.length} hang-ups.`;
  if(/repeat|twice|again|multiple|more than once/.test(q)) return Object.values(byNumber).filter(c=>c.length>1).map(c=>`${c[0].caller_name} called ${c.length} times`).join(", ")+".";
  if(/book/.test(q)) return `I booked ${booked.length} appointments: ${newPatients.length} new patients and ${booked.length-newPatients.length} existing.`;
  if(/question|parking|hcf|fee/.test(q)) return `I answered ${count("question_answered")} questions on parking, HCF and gap fees. No follow-up needed.`;
  if(/pattern|insight|trend|capacity/.test(q)) return `${naCalls.length} calls couldn't get a suitable slot, mostly for Monday or Tuesday. Early-week demand is beating capacity.`;
  return SUMMARY;
}
function ask(){
  const q=$("q").value.trim(); if(!q) return;
  const a=answer(q); $("jadeText").textContent=a; say([{text:a}],`Jade · “${q}”`); $("q").value="";
}
$("qBtn").onclick=ask; $("q").addEventListener("keydown",e=>{ if(e.key==="Enter") ask(); });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec=new SR(); rec.lang="en-AU"; rec.interimResults=false;
  $("micBtn").onclick=()=>{ speechSynthesis.cancel(); $("micBtn").classList.add("listening"); rec.start(); };
  rec.onresult=e=>{ $("q").value=e.results[0][0].transcript; ask(); };
  rec.onend=()=>$("micBtn").classList.remove("listening");
} else $("micBtn").style.display="none";
</script>
</body>
</html>
